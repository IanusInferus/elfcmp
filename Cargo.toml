[package]
name = "elfcmp"
version = "0.1.0"
edition = "2021"
description = "ELF copy-map-patch, run programs on old Linux"
license = "BSD 3-Clause"

[dependencies]
anyhow = "1.0"
clap = { version = "4.5", features = ["derive"] }
goblin = "0.9"
serde = { version = "1.0", features = ["derive"] }
serde_yaml = "0.9"
walkdir = "2.5"
tempfile = "3.12"

[dev-dependencies]
